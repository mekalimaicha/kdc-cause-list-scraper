name: Diagnose (test old dates)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test dates from many years
        run: python -m scraper.run diagnose --dates "2083-07-19,2083-07-18,2083-07-10,2083-04-15,2082-10-15,2081-05-13,2080-05-10,2078-08-20,2076-03-20,2074-11-11,2072-06-15"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose
          path: probe/
